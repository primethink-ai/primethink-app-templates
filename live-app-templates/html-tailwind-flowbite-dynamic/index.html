<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>PrimeThink Live App</title>

  <!-- Tailwind CSS v4 — PrimeThink's documented browser-build pin. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @layer base {
      button:not(:disabled), [role="button"]:not(:disabled) {
        cursor: pointer;
      }
    }
  </style>

  <!-- Flowbite core — exact version pin. -->
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.2/dist/flowbite.min.css" rel="stylesheet">

  <!-- PrimeThink host theme bridge. Keep this when adding light/dark styles. -->
  <script>
    (function () {
      function apply(theme) {
        var dark = theme === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
      }
      var forced = new URLSearchParams(location.search).get('theme');
      apply(forced || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'pt:theme') apply(event.data.theme);
      });
    })();
  </script>
</head>
<body>
  <main id="app"></main>

  <!-- Load Flowbite before application code that uses its components. -->
  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.2/dist/flowbite.min.js"></script>
  <script>
    // PrimeThink injects and initializes window.pt before the app runs.
    // Build the application from this blank Tailwind + Flowbite canvas.
    // Call initFlowbite() after dynamically inserting data-attribute components.
  </script>
</body>
</html>
