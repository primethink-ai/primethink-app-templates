<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>PrimeThink Live App</title>

  <!-- Tailwind CSS v4 — PrimeThink's documented browser-build pin. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @layer base {
      button:not(:disabled), [role="button"]:not(:disabled) {
        cursor: pointer;
      }
    }
  </style>

  <!-- PrimeThink host theme bridge. Keep this when adding light/dark styles. -->
  <script>
    (function () {
      function apply(theme) {
        var dark = theme === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
      }
      var forced = new URLSearchParams(location.search).get('theme');
      apply(forced || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'pt:theme') apply(event.data.theme);
      });
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.8",
        "react-dom/client": "https://esm.sh/react-dom@19.2.8/client",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';

    // HTM is available when JSX-like templates are useful without a build step.
    const html = htm.bind(React.createElement);
    void html;

    function App() {
      return null;
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
