<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>PrimeThink Live App</title>
  <!-- PrimeThink host theme bridge. Keep this when adding light/dark styles. -->
  <script>
    (function () {
      function apply(theme) {
        var dark = theme === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
      }
      // The app runs in an iframe: location.search has no parent params, so the
      // class PrimeThink's server injects on <html> is the next-best signal.
      var forced = new URLSearchParams(location.search).get('theme');
      if (!forced) {
        var cl = document.documentElement.classList;
        if (cl.contains('dark')) forced = 'dark';
        else if (cl.contains('light')) forced = 'light';
      }
      apply(forced || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'pt:theme') apply(event.data.theme);
      });
    })();
  </script>
</head>
<body>
  <main id="app"></main>

  <script>
    // PrimeThink injects and initializes window.pt before the app runs.
    // Build the application from this blank canvas.
  </script>
</body>
</html>
